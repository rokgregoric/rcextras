name: Bug report
description: Something looks wrong on the RevenueCat dashboard with RC Extras on
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RC Extras version
      description: Shown in chrome://extensions
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Please hide any revenue numbers you don't want public.
